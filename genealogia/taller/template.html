      else if (e.key === 'Home') this.jump(1);
      else if (e.key === 'End') this.jump(this.total());
      else if (e.key === 'Escape') this.setState({ drawer: null });
      else if (e.key === '/') { e.preventDefault(); this.setState({ drawer: 'search' }); }
      else if (e.key === 'b') this.toggleMark();
      else if (e.key === '+' || e.key === '=') this.zoom(0.12);
      else if (e.key === '-') this.zoom(-0.12);
    };
    document.addEventListener('keydown', this.onKey);
    this.onResize = () => this.measure();
    window.addEventListener('resize', this.onResize);
  }

  componentDidUpdate(prevProps) {
    if (!this.state.pw) this.measure();
    if (prevProps.typeScale !== this.props.typeScale && this.state.data) {
      clearTimeout(this.reflowT);
      this.htmlCache.clear();
      this.reflowT = setTimeout(() => this.setState({ busy: 'Recomponiendo…' }, () => requestAnimationFrame(() => this.paginate())), 200);
    }
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKey);
    window.removeEventListener('resize', this.onResize);
    if (this.ro) this.ro.disconnect();
    if (this.mDiv) this.mDiv.remove();
    clearTimeout(this.timer);
    clearTimeout(this.reflowT);
  }

  /* ---------------- geometry ---------------- */
  geom() {
    const el = this.stageRef.current;
    if (!el) return null;
    const aw = el.clientWidth - 56, ah = el.clientHeight - 56;
    if (aw <= 0 || ah <= 0) return null;
    const pref = this.state.forceMode || this.props.spreadMode || 'auto';
    const narrow = pref === 'sencilla' ? true : pref === 'doble' ? false : aw < 800;
    const ph = Math.max(Math.min(ah, aw / ((narrow ? 1 : 2) * RATIO)), 540);
    const z = this.state.zoom || 1;
    return { pw: ph * RATIO * z, ph: ph * z, narrow };
  }

  measure() {
    const g = this.geom();
    if (!g) return;
    const s = this.state;
    if (s.pw === g.pw && s.ph === g.ph && s.narrow === g.narrow) return;
    this.setState(g);
  }

  ensureMeasure() {
    const el = this.stageRef.current;
    if (el && this.observed !== el) {
      if (!this.ro) this.ro = new ResizeObserver(() => this.measure());
      try { this.ro.disconnect(); } catch (e) {}
      this.ro.observe(el);
      this.observed = el;
    }
    if (!this.state.pw && !this.pollTimer && (this.polls || 0) < 20) {
      this.pollTimer = setTimeout(() => { this.pollTimer = null; this.polls = (this.polls || 0) + 1; this.measure(); }, this.polls ? 120 : 0);
    }
  }

  /* ---------------- pagination (reference geometry, stable page numbers) ---------------- */
  measurer() {
    if (!this.mDiv) {
      const d = document.createElement('div');
      d.lang = 'es';
      d.setAttribute('aria-hidden', 'true');
      d.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none';
      document.body.appendChild(d);
      this.mDiv = d;
    }
    return this.mDiv;
  }

  paginate() {
    const S = this.S, data = this.state.data;
    if (!S || !data) return;
    const ts = this.props.typeScale ?? 0.92;
    const T = S.TRIM;
    const contentW = (T.w - 2 * T.side) * K0;
    const boxH = (T.h - T.top - T.bottom) * K0 * 0.99;
    const m = this.measurer();
    m.style.width = contentW + 'px';

    const blocks = data.blocks;
    const flow = [];
    const SKIP = ['pb', 'plate', 'display', 'autotoc', 'anchor', 'cardEnd'];
    blocks.forEach((b, bi) => { if (!SKIP.includes(b.t)) flow.push({ ...b, bi }); });
    m.innerHTML = flow.map((b) => S.blockHtml(b, K0, ts)).join('');
    const kids = Array.from(m.children);
    const adv = new Map(), lh = new Map(), own = new Map();
    const boxTop = m.getBoundingClientRect().top;
    kids.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const next = kids[i + 1];
      const bi = flow[i].bi;
      adv.set(bi, (next ? next.getBoundingClientRect().top : boxTop + m.offsetHeight) - r.top);
      own.set(bi, r.height);
      lh.set(bi, parseFloat(getComputedStyle(el).lineHeight) || 14);
    });

    const pages = [{ cover: true, head: '', folios: [] }];
    const pageOfBlock = {};
    const anchorPage = {};
    let cur = [], used = 0, head = '';
    const flush = () => { if (cur.length) { pages.push({ items: cur, head, folios: [] }); cur = []; used = 0; } };

    const place = (b, h) => { cur.push(b); used += h; pageOfBlock[b.bi] = pageOfBlock[b.bi] ?? pages.length; };

    const measureSlice = (b) => { m.innerHTML = S.blockHtml(b, K0, ts); return m.offsetHeight; };

    for (let bi = 0; bi < blocks.length; bi++) {
      const raw = blocks[bi];
      if (raw.h !== undefined && raw.h !== '') head = raw.h;
      if (raw.t === 'anchor') { flush(); anchorPage[bi] = pages.length; continue; }
      if (raw.t === 'pb') { flush(); continue; }
      if (raw.t === 'plate' || raw.t === 'display') {
        flush();
        pageOfBlock[bi] = pages.length;
        pages.push({ plate: { ...raw, bi }, head: '', folios: [] });
        continue;
      }
      if (raw.t === 'autotoc') {
        flush();
        pages.push({ toc: true, head: 'Contenido', folios: [] });
        continue;
      }
      if (raw.t === 'cardEnd') continue;
      let b = { ...raw, bi };
      const L = lh.get(bi) || 14;
      let h = adv.get(bi) || own.get(bi) || 0;
      if (KEEP.includes(b.t) && used > 0 && boxH - used < h + 3.2 * (lh.get(bi + 1) || L)) flush();
      if (used === 0 && b.t === 'p') b = { ...b, ni: 1 };

      if (used + h <= boxH + 0.5) {
        place(b, h);
        if (boxH - used < L * 1.2) flush();
        continue;
      }
      if (!SPLIT.includes(b.t) || boxH - used < L * 2.4) { flush(); }
      if (!SPLIT.includes(b.t)) {
        h = own.get(bi) || h;
        place(b, h);
        if (used > boxH) flush();
        continue;
      }
      /* split across pages */
      let words = S.wordCount(b), from = 0;
      let guard = 0;
      while (from < words && guard++ < 60) {
        const remaining = boxH - used;
        const totalLines = Math.max(1, Math.round((own.get(bi) || h) / L));
        const linesFit = Math.max(1, Math.floor(remaining / L));
        let guess = Math.min(words - from, Math.max(4, Math.floor((words - from) * (linesFit / Math.max(1, totalLines - Math.round(from / Math.max(1, words) * totalLines))) * 0.96)));
        let piece = S.sliceBlock({ ...b, contFrom: from > 0, contTo: true, ni: from > 0 ? 1 : b.ni }, from, from + guess);
        let ph = measureSlice(piece);
        let tries = 0;
        while (ph > remaining && guess > 3 && tries++ < 14) {
          guess = Math.max(3, Math.floor(guess * (guess > 20 ? 0.82 : 0.65)));
          piece = S.sliceBlock({ ...b, contFrom: from > 0, contTo: true, ni: from > 0 ? 1 : b.ni }, from, from + guess);
          ph = measureSlice(piece);
        }
        tries = 0;
        while (from + guess < words && tries++ < 40) {
          const bigger = S.sliceBlock({ ...b, contFrom: from > 0, contTo: true, ni: from > 0 ? 1 : b.ni }, from, from + guess + 3);
          const bh = measureSlice(bigger);
          if (bh > remaining) break;
          guess += 3; piece = bigger; ph = bh;
        }
        if (ph > remaining && used > 0) { flush(); continue; }
        const isLast = from + guess >= words;
        place({ ...piece, contTo: !isLast }, ph);
        from += guess;
        if (!isLast) flush();
        else if (boxH - used < L * 1.2) flush();
      }
    }
    flush();
    pages.push({ backcover: true, head: '', folios: [] });

    /* printed-folio marks */
    const byBlock = {};
    pages.forEach((pg, pi) => (pg.items || []).forEach((it) => {
      (byBlock[it.bi] = byBlock[it.bi] || []).push({ pi, w: it.w });
    }));
    data.anchors.forEach((a) => {
      const spots = byBlock[a.bi];
      let pi = spots ? spots[0].pi : (pageOfBlock[a.bi] ?? null);
      if (spots && spots.length > 1) {
        const total = spots[spots.length - 1].w ? spots[spots.length - 1].w[1] : 1;
        const target = a.frac * total;
        for (const s of spots) if (s.w && target >= s.w[0]) pi = s.pi;
      }
      if (pi != null && pages[pi]) pages[pi].folios.push(a.folio);
    });

    this.pageOfBlock = pageOfBlock;
    this.anchorPage = anchorPage;
    m.innerHTML = '';
    this.htmlCache.clear();
    const page = Math.min(this.state.page, pages.length);
    this.setState({ pages, busy: null, page }, () => this.save());
  }

  /* ---------------- navigation ---------------- */
  total() { return this.state.pages ? this.state.pages.length : 1; }
  spreadOf(n) { return Math.floor(n / 2); }
  leftOf(s) { return s === 0 ? null : 2 * s; }
  rightOf(s) { const n = 2 * s + 1; return n <= this.total() ? n : null; }
  pageAt(n) { return n && this.state.pages ? this.state.pages[n - 1] : null; }
  speed() { return this.props.flipMs ?? 720; }

  go(dir) {
    if (this.state.busy) return;
    const g = this.state.pw ? this.state : (this.geom() || {});
    if (g.narrow) return this.jump(this.state.page + dir);
    if (this.state.flip) return;
    const from = this.spreadOf(this.state.page), to = from + dir;
    if (to < 0 || this.leftOf(to) > this.total()) return;
    this.setState({ flip: { dir, from, to } }, () => {
      const leaf = this.leafRef.current;
      const end = dir > 0 ? -178 : 0, start = dir > 0 ? 0 : -178;
      if (leaf) {
        leaf.style.transition = 'none';
        leaf.style.transform = 'rotateY(' + start + 'deg)';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const l = this.leafRef.current;
          if (!l) return;
          l.style.transition = 'transform ' + this.speed() + 'ms cubic-bezier(.44,.06,.26,1)';
          l.style.transform = 'rotateY(' + end + 'deg)';
        }));
      }
      clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        const page = to === 0 ? 1 : 2 * to;
        this.setState({ flip: null, page }, () => this.save());
      }, this.speed() + 30);
    });
  }

  jump(n) {
    const page = Math.max(1, Math.min(this.total(), n));
    clearTimeout(this.timer);
    this.setState({ page, flip: null }, () => this.save());
  }

  jumpToBlock(bi) {
    const pi = this.pageOfBlock ? (this.pageOfBlock[bi] ?? null) : null;
    if (pi != null) this.jump(pi + 1);
  }

  zoom(d) {
    const z = Math.max(0.7, Math.min(2.2, Math.round((this.state.zoom + d) * 100) / 100));
    this.setState({ zoom: z }, () => { this.measure(); this.save(); });
  }

  save() {
    try { localStorage.setItem(KEY, JSON.stringify({ page: this.state.page, zoom: this.state.zoom, marks: this.state.marks })); } catch (e) {}
  }

  firstBlockOf(n) {
    const pg = this.pageAt(n);
    if (!pg) return null;
    if (pg.plate) return pg.plate.bi;
    return pg.items && pg.items.length ? pg.items[0].bi : null;
  }

  toggleMark() {
    const bi = this.firstBlockOf(this.state.page);
    if (bi == null) return;
    const marks = this.state.marks.includes(bi) ? this.state.marks.filter((m) => m !== bi)
      : [...this.state.marks, bi].sort((a, b) => a - b);
    this.setState({ marks }, () => this.save());
  }

  search(q) {
    const needle = norm(q.trim());
    if (needle.length < 3 || !this.index) return this.setState({ q, results: [] });
    const out = [];
    for (let i = 0; i < this.index.length && out.length < 80; i++) {
      const at = this.index[i].indexOf(needle);
      if (at < 0) continue;
      const raw = this.plain[i];
      const from = Math.max(0, at - 50);
      out.push({ bi: i, snippet: (from > 0 ? '…' : '') + raw.slice(from, at + needle.length + 80).replace(/\s+/g, ' ') + '…' });
    }
    this.setState({ q, results: out });
  }

  /* ---------------- render ---------------- */
  pageHtmlFor(n, k) {
    const pg = this.pageAt(n);
    if (!pg || !this.S) return '';
    const ts = this.props.typeScale ?? 0.92;
    const key = n + '@' + k.toFixed(3) + '@' + ts;
    if (this.htmlCache.has(key)) return this.htmlCache.get(key);
    let html;
    if (pg.cover) html = this.S.coverHtml(k, ts);
    else if (pg.backcover) html = this.S.backCoverHtml(k, ts);
    else if (pg.plate) html = this.S.plateHtml(pg.plate, k, ts);
    else if (pg.toc) {
      const pageOf = {};
      (this.state.data.toc || []).forEach((t) => {
        const pi = this.anchorPage && this.anchorPage[t.i] != null ? this.anchorPage[t.i] : (this.pageOfBlock ? this.pageOfBlock[t.i] : null);
        if (pi != null) pageOf[t.i] = pi + 1;
      });
      html = this.S.tocHtml(this.state.data.toc || [], pageOf, k, ts);
    } else html = this.S.pageHtml(pg.items, k, ts);
    this.htmlCache.set(key, html);
    return html;
  }

  renderVals() {
    this.ensureMeasure();
    const s = this.state;
    const g = s.pw ? { pw: s.pw, ph: s.ph, narrow: s.narrow } : (this.geom() || { pw: 0, ph: 0, narrow: false });
    const pw = g.pw, ph = g.ph, narrow = g.narrow;
    const k = pw ? pw / 439.37 : 1;
    const flip = s.flip, cur = this.spreadOf(s.page), fwd = flip && flip.dir > 0;
    const from = flip ? flip.from : cur, to = flip ? flip.to : cur;

    let leftN, rightN, frontN, backN;
    if (narrow) { leftN = null; rightN = s.page; }
    else if (!flip) { leftN = this.leftOf(cur); rightN = this.rightOf(cur); }
    else if (fwd) { leftN = this.leftOf(from); rightN = this.rightOf(to); frontN = this.rightOf(from); backN = this.leftOf(to); }
    else { leftN = this.leftOf(to); rightN = this.rightOf(from); frontN = this.rightOf(to); backN = this.leftOf(from); }

    const info = (n) => {
      const pg = this.pageAt(n);
      return {
        html: n ? this.pageHtmlFor(n, k) : '',
        head: pg && pg.head ? pg.head : '',
        num: pg && !pg.cover && !pg.backcover && !pg.plate ? String(n) : '',
        folios: pg && pg.folios && pg.folios.length ? 'folio ' + (pg.folios.length > 1 ? pg.folios[0] + '–' + pg.folios[pg.folios.length - 1] : pg.folios[0]) : '',
        plate: !!(pg && (pg.plate || pg.cover || pg.backcover))
      };
    };
    const L = info(leftN), R = info(rightN), F = info(frontN), B = info(backN);

    const slot = (side) => ({
      width: pw + 'px', height: ph + 'px', flex: '0 0 auto', position: 'relative',
      background: this.props.paper ?? '#faf8f5',
      border: '1px solid rgba(28,27,26,.14)',
      borderRadius: side === 'l' ? '2px 0 0 2px' : '0 2px 2px 0',
      boxShadow: side === 'l' ? '-8px 10px 26px rgba(28,27,26,.18)' : '8px 10px 26px rgba(28,27,26,.18)',
      cursor: side === 'l' ? 'w-resize' : 'e-resize', overflow: 'hidden'
    });

    const drawer = s.drawer;
    let items = [];
    if (drawer === 'toc') {
      items = (s.data ? s.data.toc : []).map((t) => {
        const pi = this.anchorPage && this.anchorPage[t.i] != null ? this.anchorPage[t.i] : (this.pageOfBlock ? this.pageOfBlock[t.i] : null);
        return {
          label: t.label,
          meta: pi != null ? 'p. ' + (pi + 1) : '',
          snippet: '',
          style: t.lvl === 0
            ? { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '13px', letterSpacing: '0.1em', wordSpacing: '-0.1em', textTransform: 'uppercase', color: '#7D4343' }
            : { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '15px' },
          go: () => { if (pi != null) this.jump(pi + 1); }
        };
      });
    } else if (drawer === 'search') {
      items = s.results.map((r) => {
        const pi = this.pageOfBlock ? this.pageOfBlock[r.bi] : null;
        return { label: pi != null ? 'Página ' + (pi + 1) : 'Sin paginar', meta: '', snippet: r.snippet,
          style: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '14px' },
          go: () => this.jumpToBlock(r.bi) };
      });
    } else if (drawer === 'marks') {
      items = s.marks.map((bi) => {
        const pi = this.pageOfBlock ? this.pageOfBlock[bi] : null;
        const txt = this.plain && this.plain[bi] ? this.plain[bi].slice(0, 110) : '';
        return { label: pi != null ? 'Página ' + (pi + 1) : 'Marcador', meta: '', snippet: txt,
          style: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '14px' },
          go: () => this.jumpToBlock(bi) };
      });
    }

    const curPg = this.pageAt(s.page);
    const folioNow = curPg && curPg.folios && curPg.folios.length ? ' · folio ' + curPg.folios[0] : '';
    const bi = this.firstBlockOf(s.page);

    return {
      busy: !!s.busy, busyLabel: s.busy || '',
      total: this.total(), page: s.page, k,
      paper: this.props.paper ?? '#faf8f5',
      showHead: this.props.showRunHead !== false,
      stageRef: this.stageRef, leafRef: this.leafRef,
      flipping: !!flip,
      showSpine: !narrow && !!leftN && !!rightN,
      hasLeft: !narrow && !!leftN, hasRight: !!rightN,
      leftHtml: L.html, leftHead: L.head, leftNum: L.num, leftFolios: L.folios, leftPlate: L.plate,
      rightHtml: R.html, rightHead: R.head, rightNum: R.num, rightFolios: R.folios, rightPlate: R.plate,
      frontHtml: F.html, frontHead: F.head, frontNum: F.num, frontFolios: F.folios, frontPlate: F.plate,
      backHtml: B.html, backHead: B.head, backNum: B.num, backFolios: B.folios, backPlate: B.plate,

      next: () => this.go(1), prev: () => this.go(-1),
      onSlide: (e) => this.jump(parseInt(e.target.value, 10)),
      onQuery: (e) => this.search(e.target.value),
      q: s.q,
      zoomIn: () => this.zoom(0.12), zoomOut: () => this.zoom(-0.12),
      zoomLabel: Math.round(s.zoom * 100) + '%',
      toggleToc: () => this.setState({ drawer: drawer === 'toc' ? null : 'toc' }),
      toggleSearch: () => this.setState({ drawer: drawer === 'search' ? null : 'search' }),
      toggleMarks: () => this.setState({ drawer: drawer === 'marks' ? null : 'marks' }),
      closeDrawer: () => this.setState({ drawer: null }),
      toggleMark: () => this.toggleMark(),
      toggleSpread: () => this.setState({ forceMode: narrow ? 'doble' : 'sencilla' }, () => this.measure()),
      isMarked: bi != null && s.marks.includes(bi),
      markLabel: bi != null && s.marks.includes(bi) ? 'Marcada' : 'Marcar',
      spreadLabel: narrow ? 'Doble' : 'Sencilla',
      tocOpen: drawer === 'toc', searchOpen: drawer === 'search', marksOpen: drawer === 'marks',
      drawerOpen: !!drawer,
      drawerTitle: drawer === 'toc' ? 'Contenido' : drawer === 'search' ? 'Búsqueda' : 'Marcadores',
      drawerItems: items,
      resultLabel: s.q.trim().length < 3 ? 'Escriba al menos tres letras'
        : s.results.length + (s.results.length === 1 ? ' pasaje' : ' pasajes') + ' con «' + s.q.trim() + '»',
      emptyNote: drawer === 'marks' && !s.marks.length
        ? 'Sin marcadores. El botón «Marcar» o la tecla B guardan la página en curso; la última página leída se recuerda por sí sola.'
        : (drawer === 'search' && s.q.trim().length >= 3 && !s.results.length ? 'Sin resultados en el volumen.' : ''),
      positionLabel: (narrow ? 'Página ' + s.page : (leftN ? 'Páginas ' + leftN + '–' + (rightN || leftN) : 'Página 1')) + ' de ' + this.total() + folioNow,

      shellStyle: { position: 'fixed', inset: 0, display: 'flex', flexDirection: 'column',
        background: this.props.desk ?? '#e7e4e2', color: 'var(--color-text)', fontFamily: 'var(--font-body)' },
      headerStyle: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '20px',
        padding: '12px 20px', borderBottom: '1px solid var(--color-divider)', background: 'var(--color-bg)', flex: '0 0 auto' },
      stageStyle: { flex: 1, minHeight: 0, overflow: 'auto', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '28px' },
      perspectiveStyle: { perspective: '2600px', perspectiveOrigin: '50% 46%', margin: 'auto' },
      spreadStyle: { position: 'relative', display: 'flex', alignItems: 'stretch', transformStyle: 'preserve-3d',
        paddingLeft: narrow ? 0 : (leftN ? 0 : pw + 'px') },
      leftSlotStyle: slot('l'), rightSlotStyle: slot('r'),
      spineStyle: { position: 'absolute', top: 0, bottom: 0, left: '50%', width: '32px',
        transform: 'translateX(-16px)', pointerEvents: 'none', zIndex: 4,
        background: 'linear-gradient(90deg, rgba(28,27,26,0) 0%, rgba(28,27,26,.10) 42%, rgba(28,27,26,.16) 50%, rgba(28,27,26,.10) 58%, rgba(28,27,26,0) 100%)' },
      leafStyle: { position: 'absolute', top: 0, right: 0, width: pw + 'px', height: ph + 'px',
        transformStyle: 'preserve-3d', transformOrigin: 'left center', zIndex: 6,
        boxShadow: '0 12px 32px rgba(28,27,26,.24)' },
      leafFaceStyle: { position: 'absolute', inset: 0, backfaceVisibility: 'hidden', background: this.props.paper ?? '#faf8f5',
        border: '1px solid rgba(28,27,26,.14)', borderRadius: '0 2px 2px 0', overflow: 'hidden' },
      leafBackStyle: { position: 'absolute', inset: 0, backfaceVisibility: 'hidden', transform: 'rotateY(180deg)',
        background: this.props.paper ?? '#faf8f5', border: '1px solid rgba(28,27,26,.14)', borderRadius: '2px 0 0 2px', overflow: 'hidden' },
      footerStyle: { display: 'flex', alignItems: 'center', gap: '16px', padding: '10px 20px',
        borderTop: '1px solid var(--color-divider)', background: 'var(--color-bg)', flex: '0 0 auto' },
      drawerStyle: { position: 'absolute', top: 0, bottom: 0, left: 0, width: 'min(430px, 88vw)',
        background: 'var(--color-bg)', borderRight: '1px solid var(--color-divider)',
        boxShadow: '12px 0 32px rgba(28,27,26,.18)', padding: '18px 20px', display: 'flex', flexDirection: 'column', zIndex: 20 },
      busyStyle: { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center',
        justifyContent: 'center', gap: '14px', background: this.props.desk ?? '#e7e4e2', zIndex: 30 }
    };
  }
}
</script>
